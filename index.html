<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>텅장구조대</title><meta name="description" content="사고 싶은 건 많은데 통장이 텅 비었다면. 가상으로 결제하고 대리만족하세요.">
<!-- 첫 페인트에서 랜딩이 번쩍 보이지 않게 스플래시 클래스를 먼저 붙인다 -->
<script>document.documentElement.classList.add('splash')</script>
<link rel="preload" as="image" href="/assets/splash/1.jpg"><link rel="preload" as="image" href="/assets/splash/2.jpg"><link rel="preload" as="image" href="/assets/splash/3.jpg">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><link rel="stylesheet" href="/assets/style.css"></head><body>
<div class="sp-photos" id="spPhotos" aria-hidden="true">
  <img src="/assets/splash/1.jpg" alt="" style="object-position:30% 50%">
  <img src="/assets/splash/2.jpg" alt="" style="object-position:55% 50%">
  <img src="/assets/splash/3.jpg" alt="" style="object-position:50% 50%">
</div>
<main class="wrap landing" id="landing">
  <h1 class="brand" id="brand"><img src="/assets/logo.png" width="640" height="437" alt="텅장구조대 BANK RESCUE"></h1>
  <div class="eng fade" style="--i:0">RESCUE YOUR ACCOUNT 2026</div>
  <p class="intro fade" style="--i:1">사고 싶은 건 많은데<br>통장이 텅 비었다면,<br>가상으로 질러 보세요.</p>
  <form class="searchbar fade" id="f" action="/search.html" style="--i:2"><div class="field"><input id="q" name="q" type="search" placeholder="사고 싶은 물건을 검색해 보세요" autocomplete="off" enterkeyhint="search"><button type="button" class="clear" id="qx" aria-label="검색어 지우기"></button></div><button class="btn sec">검색</button></form>
  <div class="chips fade" style="--i:3">
    <a class="chip" href="/search.html?q=%EC%97%90%EC%96%B4%ED%8C%9F">에어팟</a>
    <a class="chip" href="/search.html?q=%EB%A7%A5%EB%B6%81">맥북</a>
    <a class="chip" href="/search.html?q=%EB%8B%8C%ED%85%90%EB%8F%84%20%EC%8A%A4%EC%9C%84%EC%B9%98">닌텐도 스위치</a>
    <a class="chip" href="/search.html?q=%EC%BA%A0%ED%95%91%EC%9D%98%EC%9E%90">캠핑의자</a>
    <a class="chip" href="/search.html?q=%EB%A0%88%EA%B3%A0">레고</a>
  </div>
  <p class="foot note fade" style="--i:4">네이버쇼핑 실제 상품을 담고 가상으로 결제해요.<br>실제로 돈은 한 푼도 나가지 않아요.</p>
</main>
<script src="/assets/app.js"></script>
<script>
// 검색: 빈 검색어는 이동하지 않고 검색창에 포커스만 준다. 나머지는 /search.html?q=검색어 로 이동한다.
const f=document.getElementById('f'),q=document.getElementById('q'),qx=document.getElementById('qx');
qx.innerHTML=ICON.close;
const syncX=()=>qx.classList.toggle('on',q.value.length>0&&document.activeElement===q);
q.addEventListener('input',syncX);q.addEventListener('focus',syncX);q.addEventListener('blur',()=>setTimeout(syncX,120));
qx.onmousedown=e=>e.preventDefault();
qx.onclick=()=>{q.value='';q.focus();syncX()};
f.onsubmit=e=>{const v=q.value.trim().replace(/\s+/g,' ');if(!v){e.preventDefault();q.focus();return}q.value=v};

// 스플래시: 0 사진 3장 인트로 -> 1 로고 화면 -> 2 전환(바탕 흰색, 로고 제자리로) -> 3 종료
(function(){
  const root=document.documentElement;
  if(!root.classList.contains('splash'))return;
  const h=document.getElementById('brand'),layer=document.getElementById('spPhotos'),imgs=[...layer.querySelectorAll('img')];
  const T={photo:250,logo:1300,end:1100};
  let phase='boot',timers=[];
  const later=(fn,ms)=>{timers.push(setTimeout(fn,ms))};
  const clearAll=()=>{timers.forEach(clearTimeout);timers=[]};
  const removePhotos=()=>{if(layer.parentNode)layer.remove()};
  function end(){ // 3: 스플래시 종료
    phase='done';document.removeEventListener('pointerdown',onTap);
    h.style.transition='';h.style.transform='';
    root.classList.remove('splash','sp-go','sp-ready');
    q.focus({preventScroll:true});
  }
  function go(){ // 2: 전환. 바탕은 흰색으로, 로고는 검정이 되며 제자리로(FLIP: transform 제거)
    if(phase==='go'||phase==='done')return;
    phase='go';clearAll();removePhotos();
    h.style.transition='transform .7s ease-in-out';
    root.classList.add('sp-go');
    requestAnimationFrame(()=>{h.style.transform=''});
    later(end,T.end);
  }
  function logo(){phase='logo';later(go,T.logo)} // 1: 로고 화면
  function showPhoto(k){imgs[k].classList.add('on');if(k>0)imgs[k].classList.add('in')}
  function intro(){ // 0: 사진 3장을 한 장에 0.25초씩 넘긴다(총 0.75초)
    phase='intro';let k=0;showPhoto(0);
    const step=()=>{k++;if(k<imgs.length){showPhoto(k);later(step,T.photo)}else{removePhotos();logo()}};
    later(step,T.photo);
  }
  function onTap(){if(phase!=='done')go()} // 인트로와 로고 화면 어디서든 누르면 바로 전환으로
  try{
    history.scrollRestoration='manual';window.scrollTo(0,0);
    document.addEventListener('pointerdown',onTap);
    // FLIP: 로고를 화면 정가운데(1.2배)에 두고 시작한다. 가로는 자기 폭의 50% 기준이라 폭이 바뀌어도 가운데가 맞는다.
    const r=h.getBoundingClientRect();
    const dy=innerHeight/2-(r.top+r.height/2);
    h.style.transform='translate(calc('+(innerWidth/2-r.left)+'px - 50%), '+dy+'px) scale(1.2)';
    root.classList.add('sp-ready');
    // 첫 사진을 0.5초 안에 못 불러오면 인트로를 건너뛰고 바로 로고 화면으로
    const first=new Image();first.src=imgs[0].getAttribute('src');
    const ready=first.decode?first.decode().then(()=>true,()=>false):new Promise(res=>{first.onload=()=>res(true);first.onerror=()=>res(false)});
    Promise.race([ready,new Promise(res=>setTimeout(()=>res(false),500))]).then(ok=>{
      if(phase!=='boot')return; // 그사이 눌렀다면 이미 넘어갔다
      if(ok)intro();else{removePhotos();logo()}
    });
  }catch(e){root.classList.remove('splash','sp-go','sp-ready');layer.remove();q.focus({preventScroll:true})}
})();
</script></body></html>
