<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>구조 보고서 · 텅장구조대</title><link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><link rel="stylesheet" href="/assets/style.css"></head><body class="dark">
<main class="wrap" id="m" style="padding-bottom:120px"></main>
<div class="bar"><div class="wrap"><div class="btnrow"><a class="btn sec lg" href="/">처음으로</a><button class="btn" onclick="print()">영수증 저장</button></div></div></div>
<script src="/assets/app.js"></script>
<script>
const id=new URLSearchParams(location.search).get('id');
const o=load(ORDERS,[]).find(x=>x.id===id);
const m=document.getElementById('m');
if(!o){document.body.classList.remove('dark');m.innerHTML='<div class="empty">구조 보고서를 찾을 수 없어요.<br><a class="btn sec" href="/search.html">쇼핑하러 가기</a></div>'}
else{
  const qty=o.items.reduce((a,b)=>a+b.qty,0),d=new Date(o.at).toLocaleString('ko-KR');
  m.innerHTML=`<div class="printer"><div class="receipt"><h3>텅장구조대</h3><div class="c sub">구조 보고서</div><hr>
  <div class="rl"><span>주문번호</span><span>${esc(o.id)}</span></div><div class="rl"><span>일시</span><span>${esc(d)}</span></div>
  <div class="rl"><span>받는 분</span><span>${esc(o.nick)}</span></div><div class="rl"><span>결제수단</span><span>${esc(o.method)}</span></div><hr>
  ${o.items.map(x=>`<div class="rl"><span>${esc(x.name)}</span><span>× ${x.qty}</span></div><div class="rl sub"><span></span><span>${won(x.price*x.qty)}</span></div>`).join('')}<hr>
  <div class="rl"><span>상품 ${qty}개 합계</span><span>${won(o.total)}</span></div>
  <div class="rl b"><span>실제 결제 금액</span><span>0원</span></div>
  <div class="rl b"><span>지켜낸 내 돈</span><span>${won(o.total)}</span></div><hr>
  <div class="c">통장은 평화롭습니다.</div><span class="stamp">대리만족 완료</span></div></div>`;
}
</script></body></html>
