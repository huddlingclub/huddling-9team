<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>결제 · 텅장구조대</title><link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><link rel="stylesheet" href="/assets/style.css"></head><body>
<header class="top" id="top"></header>
<main class="wrap pb1"><h2 class="page-title">결제</h2>
  <section class="box"><h3>배송지</h3><input id="nick" maxlength="20" placeholder="받는 분 이름 (영수증에 찍혀요)" aria-label="받는 분 이름"><p class="note" style="margin:8px 0 0">상상 속 우리 집으로 보내드려요.</p></section>
  <section class="box"><h3>주문 상품</h3><div id="items"></div></section>
  <section class="box"><h3>결제 수단</h3><div class="pay" id="pay"></div></section>
  <section class="box"><h3>금액 요약</h3><div id="sum"></div></section>
  <p class="note">결제하기를 눌러도 실제로 돈이 나가지 않아요.</p>
</main>
<div class="bar"><div class="wrap"><button class="btn" id="go">결제하기</button></div></div>
<div class="overlay" id="ov"><div><h2>결제 진행 중</h2><p id="ovp">통장은 안전해요</p><div class="track"><i id="bar"></i></div></div></div>
<script src="/assets/app.js"></script>
<script>
const c=cart.get(); if(!c.length) location.replace('/cart.html');
const METHODS=['상상카드','허공페이','상상입금']; let method=METHODS[0];
document.getElementById('items').innerHTML=c.map(x=>`<div class="it"><span>${esc(x.name)} × ${x.qty}</span><span>${won(x.price*x.qty)}</span></div>`).join('');
const pay=document.getElementById('pay');
const drawPay=()=>pay.innerHTML=METHODS.map(m=>`<button data-m="${m}" class="${m===method?'on':''}">${m}</button>`).join('');
pay.onclick=e=>{if(e.target.dataset.m){method=e.target.dataset.m;drawPay()}};drawPay();
document.getElementById('sum').innerHTML=`<div class="l"><span>상품 금액</span><span>${won(cart.total())}</span></div><div class="l"><span>가상 결제</span><span>- ${won(cart.total())}</span></div><div class="l t"><span>실제로 나가는 돈</span><span>0원</span></div>`;
const MSG=['상상카드 승인 요청 중','통장 잔고 확인 중 (보지 마세요)','카드값 걱정 필터 적용 중','결제 승인'];
document.getElementById('go').onclick=()=>{
  const nick=document.getElementById('nick').value.trim()||'익명의 텅장러';
  const order={id:'TJ'+Date.now().toString(36).toUpperCase(),nick,method,at:new Date().toISOString(),items:c,total:cart.total()};
  const all=load(ORDERS,[]);all.unshift(order);save(ORDERS,all.slice(0,20));
  document.getElementById('ov').classList.add('on');
  requestAnimationFrame(()=>document.getElementById('bar').style.width='100%');
  let i=0;const t=setInterval(()=>{document.getElementById('ovp').textContent=MSG[Math.min(++i,MSG.length-1)]},700);
  setTimeout(()=>{clearInterval(t);cart.clear();location.href='/receipt.html?id='+order.id},2500);
};
</script></body></html>
